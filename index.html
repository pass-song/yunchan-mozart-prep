<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공연 예습</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 첫 화면: 공연 목록 -->
    <section id="home-view" class="list-view" hidden>
      <header class="list-header"><h1>공연 예습</h1></header>
      <ul id="concert-list" class="cards"></ul>
    </section>

    <!-- 공연을 고르면: 곡·악장 목록 -->
    <section id="concert-view" class="list-view" hidden>
      <header class="list-header">
        <a href="#/" class="back">← 공연 목록</a>
        <h1 id="concert-title"></h1>
        <div id="concert-meta" class="meta"></div>
      </header>
      <ol id="piece-list" class="pieces"></ol>
    </section>

    <!-- 악장을 고르면: 영상 + 악보 -->
    <section id="player-view" hidden>
      <header id="header">
        <div>
          <a id="back-to-concert" href="#/" class="back">← 곡 목록</a>
          <div id="title"></div>
          <div id="subtitle"></div>
        </div>
        <div class="scale" aria-label="악보 크기">
          <button id="scale-down" type="button" aria-label="악보 작게">−</button>
          <span id="scale"></span>
          <button id="scale-up" type="button" aria-label="악보 크게">+</button>
        </div>
      </header>
      <section id="player-bar">
        <div id="yt-player"></div>
        <div class="controls">
          <div class="row">
            <select id="movement" aria-label="악장"></select>
            <button id="play-pause" type="button" disabled>재생</button>
          </div>
          <span id="status"></span>
        </div>
      </section>
      <main id="score"></main>
    </section>

    <footer id="credit"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
